[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdials"
version = "0.1.0"
description = "PV-DIAL: provenance-driven diagnosis of disagreement between PV simulation pipelines"
requires-python = ">=3.11"
dependencies = [
    "pvlib==0.15.2",
    "pandas",
    "numpy",
    "scipy",
    "pyyaml",
    "streamlit",
    "plotly",
    "psycopg[binary]",
    "python-dotenv",
    "prov",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"